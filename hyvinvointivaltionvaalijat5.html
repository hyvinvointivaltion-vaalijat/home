<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyvinvointivaltion Vaalijat ry · v5</title>
<meta name="description" content="Hyvinvointivaltion Vaalijat ry ja Rakennemuutosten Atlas samassa näkymäkuoressa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f7f4ee;--surface:#fffdf8;--sunk:#efeae1;--ink:#17201f;--muted:#74807c;
  --line:#ddd6c9;--line-soft:#e9e3d8;--forest:#20514c;--copper:#b4632c;
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;
  --nav-h:64px;
}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
button{font:inherit;color:inherit}
.topbar{
  position:relative;z-index:100;display:flex;align-items:center;gap:18px;min-height:var(--nav-h);
  padding:9px 20px;background:rgba(247,244,238,.94);backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;flex:none;border-radius:50%;background:conic-gradient(from 210deg,var(--forest),#c9962a,var(--copper),var(--forest))}
.brand h1{margin:0;font:600 19px/1.1 var(--serif);white-space:nowrap}
.brand .sub{font:500 10px/1 var(--mono);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:2px;margin-left:auto;padding:3px;background:var(--sunk);border:1px solid var(--line-soft);border-radius:999px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:7px 13px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.tab .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.48}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(13,42,44,.08)}
.tab[aria-selected="true"] .dot{opacity:1;background:var(--copper)}
.tools{display:flex;gap:8px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
#viewRoot{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
.view-frame{display:block;width:100%;height:100%;border:0;background:var(--paper)}
.murros-crop{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
.murros-crop .view-frame{position:absolute;left:0;top:calc(-1 * var(--murros-inner-nav,64px));width:100%;height:calc(100% + var(--murros-inner-nav,64px));}
.loader{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--paper);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.loader[hidden]{display:none}
@media(max-width:1050px){.brand .sub{display:none}.tab{padding:7px 10px}}
@media(max-width:760px){
  .topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand{flex:1}
  .tabs{order:3;width:100%;margin-left:0}
  #viewRoot{min-height:0}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>Hyvinvointivaltion Vaalijat ry</h1>
    <span class="sub">Atlas</span>
  </div>

  <nav class="tabs" aria-label="Näkymä">
    <button class="tab" data-view="yhdistys" aria-selected="true"><span class="dot"></span>Yhdistys</button>
    <button class="tab" data-view="rengas" aria-selected="false"><span class="dot"></span>Rengas</button>
    <button class="tab" data-view="verkko" aria-selected="false"><span class="dot"></span>Verkko</button>
    <button class="tab" data-view="matriisi" aria-selected="false"><span class="dot"></span>Matriisi</button>
    <button class="tab" data-view="paattely" aria-selected="false"><span class="dot"></span>Päättely</button>
    <button class="tab" data-view="maisema" aria-selected="false"><span class="dot"></span>Maisema 3D</button>
    <button class="tab" data-view="tulkinta" aria-selected="false"><span class="dot"></span>Tulkinta</button>
  </nav>

  <div class="tools">
    <button class="icon-btn" id="fsBtn" type="button" aria-label="Koko näyttö">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="viewRoot">
  <div class="loader" id="loader">Ladataan näkymää…</div>
</main>

<script>
(() => {
  const root = document.getElementById('viewRoot');
  const loader = document.getElementById('loader');
  const tabs = [...document.querySelectorAll('.tab')];
  const fsBtn = document.getElementById('fsBtn');

  const VIEWS = {
    yhdistys: {
      title: 'Yhdistys',
      url: './hyvinvointivaltionvaalijat4.html',
      sameOrigin: true
    },
    rengas: {
      title: 'Rengas',
      url: 'https://harrikayhko.fi/atlas/murros/index.html#rengas',
      cropMurrosTopbar: true
    },
    verkko: {
      title: 'Verkko',
      url: 'https://harrikayhko.fi/atlas/murros/index.html#verkko',
      cropMurrosTopbar: true
    },
    matriisi: {
      title: 'Matriisi',
      url: 'https://harrikayhko.fi/atlas/murros/matriisi.html'
    },
    paattely: {
      title: 'Päättely',
      url: 'https://harrikayhko.fi/atlas/index.html'
    },
    maisema: {
      title: 'Maisema 3D',
      url: 'https://harrikayhko.fi/atlas/maisema.html'
    },
    tulkinta: {
      title: 'Tulkinta',
      url: 'https://harrikayhko.fi/atlas/tulkinta.html'
    }
  };

  let active = null;
  let frame = null;

  function selectedView() {
    const key = location.hash.replace(/^#\/?/, '');
    return VIEWS[key] ? key : 'yhdistys';
  }

  function setActiveTab(name) {
    tabs.forEach(tab =>
      tab.setAttribute('aria-selected', String(tab.dataset.view === name))
    );
  }

  function cleanAssociationFrame() {
    if (!frame) return;
    try {
      const doc = frame.contentDocument;
      if (!doc) return;

      // V5-kuori on ainoa ylävalikko: v4:n oma header piilotetaan.
      const header = doc.querySelector('header.nav');
      if (header) header.style.display = 'none';

      const style = doc.createElement('style');
      style.id = 'v5-association-embed';
      style.textContent = `
        html{scroll-padding-top:0!important}
        body{padding-top:0!important}
        header.nav{display:none!important}
      `;
      doc.head.appendChild(style);

      // "Avaa Atlas" ei vie pois hyvinvointivaltio-osoitteesta:
      // se vaihtaa v5-kuoren rengasnäkymään.
      doc.querySelectorAll('a[href="#atlas"], a[href*="#atlas"]').forEach(link => {
        link.addEventListener('click', event => {
          event.preventDefault();
          parent.location.hash = 'rengas';
        });
      });
    } catch (error) {
      console.warn('Yhdistyssivun upotuksen siistiminen epäonnistui:', error);
    }
  }

  function showView(name) {
    if (!VIEWS[name] || active === name) return;
    const view = VIEWS[name];
    active = name;
    setActiveTab(name);
    loader.hidden = false;

    if (frame) {
      frame.src = 'about:blank';
      const crop = frame.closest('.murros-crop');
      frame.remove();
      crop?.remove();
    }

    frame = document.createElement('iframe');
    frame.className = 'view-frame';
    frame.title = view.title;
    frame.allow = 'fullscreen';
    frame.loading = 'eager';

    frame.addEventListener('load', () => {
      if (name === 'yhdistys') cleanAssociationFrame();
      loader.hidden = true;
    }, { once:true });

    frame.src = view.url;

    if (view.cropMurrosTopbar) {
      const crop = document.createElement('div');
      crop.className = 'murros-crop';
      crop.appendChild(frame);
      root.appendChild(crop);
    } else {
      root.appendChild(frame);
    }
    document.title = `${view.title} · Hyvinvointivaltion Vaalijat ry`;
  }

  tabs.forEach(tab => tab.addEventListener('click', () => {
    const name = tab.dataset.view;
    if (location.hash.replace(/^#\/?/, '') === name) {
      showView(name);
    } else {
      location.hash = name;
    }
  }));

  window.addEventListener('hashchange', () => showView(selectedView()));

  window.addEventListener('keydown', event => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const map = {
      '1':'yhdistys','2':'rengas','3':'verkko','4':'matriisi',
      '5':'paattely','6':'maisema','7':'tulkinta'
    };
    if (map[event.key]) location.hash = map[event.key];
  });

  fsBtn.addEventListener('click', () => {
    document.fullscreenElement
      ? document.exitFullscreen()
      : document.documentElement.requestFullscreen();
  });

  showView(selectedView());
})();
</script>
</body>
</html>
