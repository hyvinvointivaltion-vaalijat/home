<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyvinvointivaltion Vaalijat ry — v5</title>
<meta name="robots" content="noindex">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f4ee}
#mainPage{display:block;width:100%;height:100%;border:0;background:#f7f4ee}
</style>
</head>
<body>
<iframe id="mainPage" src="./hyvinvointivaltionvaalijat4.html" title="Hyvinvointivaltion Vaalijat ry"></iframe>
<script>
(() => {
  const frame = document.getElementById('mainPage');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById('murros-original-module-bridge')) return;

    const style = doc.createElement('style');
    style.id = 'murros-original-module-bridge-css';
    style.textContent = `
      .atlas-lab .atlas-toolbar,
      .atlas-lab .atlas-foot,
      .atlas-lab .atlas-status { display:none !important; }
      .atlas-lab .atlas-shell { border:0 !important; box-shadow:none !important; background:transparent !important; overflow:visible !important; }
      .atlas-lab .atlas-stage { padding:0 !important; min-height:680px !important; background:transparent !important; overflow:visible !important; }
      .murros-original-nav{display:flex;align-items:center;gap:2px;position:sticky;top:var(--nav-h,74px);z-index:35;margin:0 0 18px;padding:8px 0;background:rgba(247,244,238,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line,#ddd6c9)}
      .murros-original-nav .label{margin-right:auto;font:600 10px/1.2 "Source Sans 3",sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--slate,#7a837f)}
      .murros-original-nav button,.murros-original-nav a{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-soft,#525d60);font:600 12px/1.2 "Source Sans 3",sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
      .murros-original-nav button::before,.murros-original-nav a::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
      .murros-original-nav button[aria-selected="true"]{background:var(--card,#fffdf8);color:var(--ink,#111a1c);box-shadow:0 1px 8px rgba(13,42,44,.08)}
      .murros-original-nav button[aria-selected="true"]::before{opacity:1;background:var(--copper,#b4632c)}
      .murros-original-root{position:relative;width:100%;min-height:680px;overflow:hidden;background:transparent}
      .murros-original-root>.modular-view{width:100%;min-height:680px}
      .murros-original-root>.modular-view>#app{width:100%!important;min-height:680px!important}
      .murros-original-loader{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(247,244,238,.92);font:600 10px/1.2 "Source Sans 3",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--slate,#7a837f)}
      .murros-original-loader[hidden]{display:none}
      @media(max-width:900px){.murros-original-nav{overflow-x:auto}.murros-original-nav .label{display:none}.murros-original-nav button,.murros-original-nav a{padding:7px 9px}}
    `;
    doc.head.appendChild(style);

    const script = doc.createElement('script');
    script.type = 'module';
    script.id = 'murros-original-module-bridge';
    script.textContent = `
      const BASE = 'https://harrikayhko.fi/atlas/murros/';
      const VIEWS = {
        rengas: () => import(BASE + 'views/rengas.js'),
        verkko: () => import(BASE + 'views/verkko.js'),
        matriisi: () => import(BASE + 'views/matriisi.js'),
        paattely: () => import(BASE + 'views/paattely.js'),
        maisema: () => import(BASE + 'views/maisema.js')
      };

      const oldStage = document.getElementById('atlas-stage');
      const lab = oldStage?.closest('.atlas-lab');
      if (!oldStage || !lab) throw new Error('Atlas-teemaselaimen mount-pistettä ei löytynyt.');

      const nav = document.createElement('nav');
      nav.className = 'murros-original-nav';
      nav.setAttribute('aria-label','Rakennemuutosten Atlas');
      nav.innerHTML = '<span class="label">Rakennemuutosten Atlas</span>' +
        '<button data-view="rengas" aria-selected="true">Rengas</button>' +
        '<button data-view="verkko" aria-selected="false">Verkko</button>' +
        '<button data-view="matriisi" aria-selected="false">Matriisi</button>' +
        '<button data-view="paattely" aria-selected="false">Päättely</button>' +
        '<button data-view="maisema" aria-selected="false">Maisema 3D</button>' +
        '<a href="https://harrikayhko.fi/atlas/tulkinta.html">Tulkinta</a>';

      const root = document.createElement('div');
      root.className = 'murros-original-root';
      root.id = 'murros-original-root';
      const loader = document.createElement('div');
      loader.className = 'murros-original-loader';
      loader.textContent = 'Ladataan näkymää…';
      root.appendChild(loader);

      oldStage.replaceChildren();
      oldStage.before(nav);
      oldStage.replaceWith(root);

      let activeName = null;
      let activeModule = null;
      let switching = false;

      function theme(){ return document.documentElement.dataset.theme || 'light'; }
      function setTabs(name){ nav.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === name))); }

      async function showView(name){
        if (switching || activeName === name || !VIEWS[name]) return;
        switching = true;
        loader.hidden = false;
        try {
          if (activeModule?.unmount) await activeModule.unmount(root);
          const module = await VIEWS[name]();
          await module.mount(root, { theme: theme(), isAdmin:false, adminApi:window.__murrosAdminApi || null });
          activeModule = module;
          activeName = name;
          setTabs(name);
        } catch (error) {
          console.error('V5 Murrosatlas:', error);
          root.innerHTML = '<div style="padding:28px;color:#9b392c">Näkymän lataus epäonnistui.<br><small>' + String(error?.message || error) + '</small></div>';
        } finally {
          loader.hidden = true;
          switching = false;
        }
      }

      nav.addEventListener('click', event => {
        const button = event.target.closest('button[data-view]');
        if (button) showView(button.dataset.view);
      });
      window.addEventListener('keydown', event => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const map = {'1':'rengas','2':'verkko','3':'matriisi','4':'paattely','5':'maisema'};
        if (map[event.key] && lab.getBoundingClientRect().bottom > 0) showView(map[event.key]);
      });
      showView('rengas');
    `;
    doc.body.appendChild(script);
  });
})();
</script>
</body>
</html>
