<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyvinvointivaltion Vaalijat ry · v12.4</title>
<meta name="description" content="Hyvinvointivaltion Vaalijat ry yhteisellä Atlas-navigaatiolla; visualisoinnit avautuvat itsenäisinä täyden viewportin sivuina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f7f4ee;--surface:#fffdf8;--sunk:#efeae1;--ink:#17201f;--muted:#74807c;
  --line:#ddd6c9;--line-soft:#e9e3d8;--forest:#20514c;--copper:#b4632c;
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;
  --nav-h:64px;
}
html[data-theme="dark"]{
  --paper:#111817;--surface:#182220;--sunk:#202b29;--ink:#f0eee7;--muted:#a7b0ad;
  --line:#33413e;--line-soft:#283532;--forest:#75b8ad;--copper:#d48a55;
}
html[data-theme="dark"] body{color-scheme:dark}
html[data-theme="dark"] .topbar{background:rgba(17,24,23,.96)}
html[data-theme="dark"] .module-current{background:linear-gradient(180deg,rgba(24,34,32,.96),rgba(32,43,41,.90))}

*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans)}
button{font:inherit;color:inherit}
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:18px;min-height:var(--nav-h);
  padding:9px 20px;background:rgba(247,244,238,.94);backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;flex:none;border-radius:50%;background:conic-gradient(from 210deg,var(--forest),#c9962a,var(--copper),var(--forest))}
.brand h1{margin:0;font:600 19px/1.1 var(--serif);white-space:nowrap}
.brand .sub{font:500 10px/1 var(--mono);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.topnav{display:flex;align-items:center;gap:22px;margin-left:auto}
.nav-tab{
  position:relative;padding:7px 0;border:0;background:transparent;color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap
}
.nav-tab::after{content:"";position:absolute;left:0;right:100%;bottom:1px;height:1px;background:var(--copper);transition:right .2s ease}
.nav-tab[aria-selected="true"]{color:var(--ink)}
.nav-tab[aria-selected="true"]::after{right:0}
.module-browser{
  position:relative;display:grid;grid-template-columns:28px minmax(230px,310px) 28px;
  align-items:center;gap:8px;margin-left:2px
}
.module-arrow{
  display:grid;place-items:center;width:28px;height:42px;border:0;background:transparent;
  color:var(--muted);font-size:22px;cursor:pointer;padding:0
}
.module-arrow:hover{color:var(--copper)}
.module-current{
  position:relative;display:grid;align-content:center;justify-items:center;min-width:0;height:48px;
  padding:5px 16px 6px;border:1px solid rgba(180,99,44,.22);border-radius:999px;
  background:linear-gradient(180deg,rgba(255,253,248,.9),rgba(239,234,225,.72));
  cursor:pointer
}
.module-title{font:600 12.5px/1.15 var(--serif)}
.module-question{
  display:block;max-width:260px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:500 9.5px/1.25 var(--sans);color:var(--muted)
}
.module-menu{
  position:absolute;top:calc(100% + 10px);left:50%;z-index:300;min-width:260px;padding:6px 0;
  transform:translateX(-50%);background:rgba(247,244,238,.985);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 20px 55px -30px rgba(13,42,44,.5)
}
.module-menu[hidden]{display:none}
.module-option{
  width:100%;display:grid;gap:2px;padding:9px 12px;border:0;background:transparent;color:var(--muted);
  text-align:left;cursor:pointer
}
.module-option strong{font:600 12.5px/1.2 var(--serif);color:var(--ink)}
.module-option small{font:500 10px/1.3 var(--sans);color:var(--muted)}
.module-option:hover,.module-option[aria-selected="true"]{background:rgba(255,253,248,.8)}
.module-option[aria-selected="true"] strong{color:var(--copper)}
.tools{display:flex;gap:8px}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}

#viewRoot{position:relative;min-width:0;min-height:calc(100dvh - var(--nav-h));background:var(--paper)}
#associationRoot{
  position:relative;min-height:calc(100dvh - var(--nav-h));overflow:visible;background:var(--paper)
}
#associationRoot[hidden]{display:none}
#visualRoot{
  position:relative;width:100%;height:calc(100dvh - var(--nav-h));
  min-height:560px;overflow:hidden;background:var(--paper);
  -webkit-overflow-scrolling:touch
}
#visualRoot[hidden]{display:none}
.view-frame{
  display:block;width:100%;height:100%;min-height:100%;border:0;background:var(--paper);
  overflow:auto;-webkit-overflow-scrolling:touch
}
.visual-crop{
  position:relative;width:100%;height:100%;overflow:hidden;background:var(--paper)
}
.visual-crop--verkko .view-frame{
  position:absolute;left:0;top:-62px;width:100%;height:calc(100% + 62px)
}
.theme-btn[data-theme-state="dark"] .theme-moon{display:none}
.theme-btn[data-theme-state="light"] .theme-sun{display:none}
.theme-btn svg{width:17px;height:17px}
.loader{
  position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--paper);
  font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)
}
.loader[hidden]{display:none}
.association-error{
  width:min(760px,calc(100% - 40px));margin:80px auto;padding:24px;border:1px solid var(--line);
  background:var(--surface);border-radius:12px
}
.association-error h2{margin:0 0 8px;font:600 1.6rem var(--serif)}
.association-error p{color:var(--muted)}
.v12-note{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--copper)}

@media(max-width:1050px){
  .brand .sub{display:none}.topnav{gap:15px}
  .module-browser{grid-template-columns:24px minmax(205px,260px) 24px}
  .module-current{height:46px;padding-inline:12px}.module-question{max-width:220px}
}
@media(max-width:760px){
  .topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand{flex:1}.topnav{order:3;width:100%;margin-left:0;justify-content:space-between;gap:10px;overflow-x:auto;padding-bottom:2px}
  .module-browser{grid-template-columns:24px minmax(190px,240px) 24px;flex:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <h1>Hyvinvointivaltion Vaalijat ry</h1>
    <span class="sub">Atlas</span>
  </div>

  <nav class="topnav" aria-label="Päänavigaatio">
    <button class="nav-tab" id="associationTab" type="button" aria-selected="true">Yhdistys</button>
    <button class="nav-tab" id="newsTab" type="button" aria-selected="false">Ajankohtaista</button>
    <button class="nav-tab" id="joinTab" type="button" aria-selected="false">Liity</button>

    <div class="module-browser" aria-label="Visualisointimoduuli">
      <button class="module-arrow" id="modulePrev" type="button" aria-label="Edellinen visualisointimoduuli">‹</button>
      <button class="module-current" id="moduleCurrent" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="module-title" id="moduleLabel">Murroskartta</span>
        <span class="module-question" id="moduleQuestion">Mistä Suomen suuret murrokset syntyivät?</span>
      </button>
      <button class="module-arrow" id="moduleNext" type="button" aria-label="Seuraava visualisointimoduuli">›</button>
      <div class="module-menu" id="moduleMenu" role="listbox" aria-label="Valitse visualisointimoduuli" hidden></div>
    </div>
  </nav>

  <div class="tools">
    <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Vaihda tumma tai vaalea teema" data-theme-state="light" title="Tumma / vaalea teema">
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 1 1 8.8 4a7 7 0 0 0 11.2 11.2Z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
    </button>
    <button class="icon-btn" id="fsBtn" type="button" aria-label="Koko näyttö">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<main id="viewRoot">
  <section id="associationRoot" aria-live="polite"></section>
  <section id="visualRoot" hidden aria-live="polite"></section>
  <div class="loader" id="loader">Ladataan näkymää…</div>
</main>

<script>
(() => {
  "use strict";

  const ASSOCIATION_SOURCE = "./hyvinvointivaltionvaalijat4.html";

  const VIEWS = {
    yhdistys:{title:"Yhdistys",type:"association",anchor:""},
    ajankohtaista:{title:"Ajankohtaista",type:"association",anchor:"ajankohtaista"},
    liity:{title:"Liity",type:"association",anchor:"liity"},
    murroskartta:{
      title:"Murroskartta",
      question:"Mistä Suomen suuret murrokset syntyivät?",
      url:"https://harrikayhko.fi/atlas/murroskartta.html"
    },
    rengas:{
      title:"Rengas",
      question:"Miten yksi murros kytkeytyy muihin muutoksiin?",
      url:"https://harrikayhko.fi/atlas/murros/index.html#rengas",
      crop:true
    },
    verkko:{
      title:"Verkko",
      question:"Mitkä ilmiöt muodostavat historian vaikutusverkoston?",
      url:"https://harrikayhko.fi/atlas/murros/index.html#verkko",
      crop:true
    },
    matriisi:{
      title:"Matriisi",
      question:"Missä murrokset ja näkökulmat leikkaavat toisensa?",
      url:"https://harrikayhko.fi/atlas/murros/matriisi.html"
    },
    paattely:{
      title:"Päättely",
      question:"Miten päätöksistä ja rakenteista syntyi nykyhetki?",
      url:"https://harrikayhko.fi/atlas/index.html"
    },
    maisema:{
      title:"Maisema 3D",
      question:"Miltä Suomen rakennemuutos näyttää kokonaisena maisemana?",
      url:"https://harrikayhko.fi/atlas/maisema.html"
    },
    tulkinta:{
      title:"Tulkinta",
      question:"Miten sama historia muuttuu, kun näkökulma vaihtuu?",
      url:"https://harrikayhko.fi/atlas/tulkinta.html"
    }
  };

  const MODULE_ORDER = ["murroskartta","rengas","verkko","matriisi","paattely","maisema","tulkinta"];

  const associationRoot = document.getElementById("associationRoot");
  const visualRoot = document.getElementById("visualRoot");
  const loader = document.getElementById("loader");
  const moduleMenu = document.getElementById("moduleMenu");
  const moduleCurrent = document.getElementById("moduleCurrent");
  const moduleLabel = document.getElementById("moduleLabel");
  const moduleQuestion = document.getElementById("moduleQuestion");
  const associationTab = document.getElementById("associationTab");
  const newsTab = document.getElementById("newsTab");
  const joinTab = document.getElementById("joinTab");

  let active = null;
  let associationLoaded = false;
  let associationLoadPromise = null;
  let activeFrame = null;

  const THEME_KEY = "hv-v12-theme";
  const themeBtn = document.getElementById("themeBtn");

  function currentTheme(){
    return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  }

  function sendThemeToVisualization(){
    if(!activeFrame?.contentWindow) return;
    activeFrame.contentWindow.postMessage({
      type:"atlas-theme",
      theme:currentTheme(),
      source:"hyvinvointivaltionvaalijat12"
    },"*");
  }

  function applyTheme(theme, persist=true){
    const next = theme === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    themeBtn.dataset.themeState = next;
    themeBtn.setAttribute(
      "aria-label",
      next === "dark" ? "Vaihda vaaleaan teemaan" : "Vaihda tummaan teemaan"
    );
    if(persist) localStorage.setItem(THEME_KEY,next);
    sendThemeToVisualization();
  }

  const savedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(savedTheme === "dark" ? "dark" : "light", false);

  moduleMenu.innerHTML = MODULE_ORDER.map(name =>
    `<button class="module-option" type="button" role="option" data-module="${name}">
      <strong>${VIEWS[name].title}</strong>
      <small>${VIEWS[name].question}</small>
    </button>`
  ).join("");

  function normalizeText(value){
    return String(value || "").replace(/\s+/g," ").trim().toLocaleLowerCase("fi-FI");
  }

  function removeUnwantedAssociationBlocks(root){
    // Neljän tunnuslukulaatikon ryhmä: mm. "10 rakennetta seurannassa".
    const statCandidates = [...root.querySelectorAll("section,article,div,ul,ol")].filter(el => {
      const text = normalizeText(el.textContent);
      return text.includes("10") && text.includes("rakennetta") &&
             (text.includes("seurannassa") || text.includes("atlas"));
    });
    const statGroup = statCandidates.sort((a,b) =>
      a.querySelectorAll("*").length - b.querySelectorAll("*").length
    )[0];

    if(statGroup){
      let target = statGroup;
      for(let i=0;i<3 && target.parentElement && target.parentElement !== root;i++){
        const parent = target.parentElement;
        const text = normalizeText(parent.textContent);
        const children = [...parent.children].filter(ch => normalizeText(ch.textContent)).length;
        if(children >= 3 && children <= 6 && text.includes("10") && text.includes("rakennetta")){
          target = parent;
          break;
        }
        if(["SECTION","ARTICLE"].includes(parent.tagName)) break;
        target = parent;
      }
      target.remove();
    }

    // Poista Ajattelutapa-osio riippumatta siitä onko "05" tekstinä vai pseudo-elementtinä.
    const thinkingLabel = [...root.querySelectorAll("*")]
      .filter(el => {
        const own = normalizeText([...el.childNodes]
          .filter(node => node.nodeType === Node.TEXT_NODE)
          .map(node => node.textContent).join(" "));
        return own === "ajattelutapa" || own.includes("ajattelutapa");
      })
      .sort((a,b) => a.querySelectorAll("*").length - b.querySelectorAll("*").length)[0];

    if(thinkingLabel){
      let section = thinkingLabel.closest("section,article");
      if(!section || section === root){
        let node = thinkingLabel.parentElement;
        while(node && node !== root){
          const count = node.querySelectorAll("*").length;
          if(["DIV","LI","MAIN"].includes(node.tagName) && count >= 2 && count <= 100){
            section = node;
            break;
          }
          node = node.parentElement;
        }
      }
      section?.remove();
    }
  }

  function rewriteAssociationLinks(root){
    root.querySelectorAll('a[href="#atlas"],a[href$="#atlas"],a[href*="/atlas"]').forEach(link => {
      if(link.dataset.v12Bound) return;
      link.dataset.v12Bound = "1";
      link.addEventListener("click", e => {
        const href = link.getAttribute("href") || "";
        if(href === "#atlas" || href.endsWith("#atlas")){
          e.preventDefault();
          location.hash = "rengas";
        }
      });
    });
  }

  function resolveRelativeUrl(url, base){
    try { return new URL(url, base).href; } catch { return url; }
  }

  async function importAssociationHead(parsed, sourceUrl){
    const marker = "data-v12-association-head";
    if(document.head.querySelector(`[${marker}]`)) return;

    // Tuodaan v4:n omat CSS:t samaan dokumenttiin. Skriptit käsitellään body-importin jälkeen.
    for(const node of [...parsed.head.querySelectorAll('link[rel="stylesheet"],style')]){
      const clone = node.cloneNode(true);
      clone.setAttribute(marker,"1");
      if(clone.tagName === "LINK" && clone.getAttribute("href")){
        clone.setAttribute("href", resolveRelativeUrl(clone.getAttribute("href"), sourceUrl));
      }
      document.head.appendChild(clone);
    }
  }

  async function executeAssociationScripts(parsed, sourceUrl){
    for(const oldScript of [...parsed.querySelectorAll("script")]){
      const script = document.createElement("script");
      [...oldScript.attributes].forEach(attr => {
        if(attr.name === "src") script.src = resolveRelativeUrl(attr.value, sourceUrl);
        else script.setAttribute(attr.name, attr.value);
      });
      if(!oldScript.src) script.textContent = oldScript.textContent || "";
      script.dataset.v12AssociationScript = "1";
      document.body.appendChild(script);
    }
  }

  async function loadAssociation(){
    if(associationLoaded) return;
    if(associationLoadPromise) return associationLoadPromise;

    associationLoadPromise = (async() => {
      loader.hidden = false;
      try{
        const response = await fetch(ASSOCIATION_SOURCE,{cache:"no-store"});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const parsed = new DOMParser().parseFromString(text,"text/html");
        const sourceUrl = new URL(ASSOCIATION_SOURCE,location.href).href;

        await importAssociationHead(parsed,sourceUrl);

        // Poistetaan v4:n oma yläpalkki ennen kuin sisältö tuodaan v12-kuoreen.
        parsed.querySelector("header.nav")?.remove();
        parsed.querySelector("header")?.remove();

        // Skriptit eivät kuulu suoraan innerHTML-siirtoon.
        parsed.querySelectorAll("script").forEach(s => s.remove());

        associationRoot.innerHTML = "";
        for(const child of [...parsed.body.children]){
          associationRoot.appendChild(document.importNode(child,true));
        }

        removeUnwantedAssociationBlocks(associationRoot);
        rewriteAssociationLinks(associationRoot);

        // Korjataan suhteelliset kuvat ja tavalliset linkit.
        associationRoot.querySelectorAll("[src]").forEach(el => {
          const value = el.getAttribute("src");
          if(value && !value.startsWith("data:") && !value.startsWith("blob:")){
            el.setAttribute("src",resolveRelativeUrl(value,sourceUrl));
          }
        });
        associationRoot.querySelectorAll("a[href]").forEach(a => {
          const href = a.getAttribute("href");
          if(!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || href.startsWith("javascript:")) return;
          a.setAttribute("href",resolveRelativeUrl(href,sourceUrl));
        });

        // Haetaan alkuperäinen dokumentti uudestaan skriptien suorittamista varten,
        // koska yllä poistimme skriptit DOM-siirtoa varten.
        const parsedScripts = new DOMParser().parseFromString(text,"text/html");
        await executeAssociationScripts(parsedScripts,sourceUrl);

        removeUnwantedAssociationBlocks(associationRoot);
        rewriteAssociationLinks(associationRoot);

        // Jos v4 renderöi sisältöä jälkikäteen, pidetään kaksi poistoehtoa voimassa.
        const observer = new MutationObserver(() => {
          removeUnwantedAssociationBlocks(associationRoot);
          rewriteAssociationLinks(associationRoot);
        });
        observer.observe(associationRoot,{childList:true,subtree:true});

        associationLoaded = true;
      }catch(error){
        console.error("Yhdistyssisällön lataus epäonnistui",error);
        associationRoot.innerHTML = `
          <div class="association-error">
            <div class="v12-note">V12 · yhdistetty käyttöliittymä</div>
            <h2>Yhdistyssisältöä ei voitu ladata</h2>
            <p>Tämä versio näyttää yhdistyssisällön samassa DOM:ssa ja avaa Atlas-visualisoinnit itsenäisinä sivuina ilman iframea.
            Tiedoston <code>hyvinvointivaltionvaalijat4.html</code> pitää olla tämän tiedoston rinnalla,
            kunnes sen lähdekoodi upotetaan tähän tiedostoon fyysisesti.</p>
            <p>Atlas-visualisoinnit avautuvat ylävalikosta suoraan omille sivuilleen.</p>
          </div>`;
      }finally{
        loader.hidden = true;
      }
    })();

    return associationLoadPromise;
  }

  function setTabs(name){
    associationTab.setAttribute("aria-selected",String(name==="yhdistys"));
    newsTab.setAttribute("aria-selected",String(name==="ajankohtaista"));
    joinTab.setAttribute("aria-selected",String(name==="liity"));

    moduleMenu.querySelectorAll("[data-module]").forEach(btn =>
      btn.setAttribute("aria-selected",String(btn.dataset.module===name))
    );

    if(MODULE_ORDER.includes(name)){
      moduleLabel.textContent = VIEWS[name].title;
      moduleQuestion.textContent = VIEWS[name].question;
    }
  }

  function findAssociationTarget(name){
    const words = name === "ajankohtaista"
      ? ["ajankohtaista","uutiset","ajankohtaiset"]
      : ["liity","jäseneksi","jäsenyys","liittyminen"];

    const byId = [...associationRoot.querySelectorAll("[id]")].find(el => {
      const id = normalizeText(el.id);
      return words.some(word => id === word || id.includes(word));
    });
    if(byId) return byId;

    const heading = [...associationRoot.querySelectorAll("h1,h2,h3,h4,h5,h6,.eyebrow,.kicker,.section-label,[class*='eyebrow'],[class*='kicker'],[class*='label']")]
      .find(el => {
        const t = normalizeText(el.textContent);
        return words.some(word => t === word || t.includes(word));
      });
    if(heading) return heading.closest("section,article") || heading;

    return [...associationRoot.querySelectorAll("section,article,div")]
      .filter(el => {
        const t = normalizeText(el.textContent);
        return words.some(word => t.includes(word));
      })
      .sort((a,b) => a.querySelectorAll("*").length - b.querySelectorAll("*").length)[0] || null;
  }

  async function showAssociation(name){
    if(activeFrame){
      activeFrame.src = "about:blank";
      activeFrame = null;
    }
    visualRoot.hidden = true;
    visualRoot.innerHTML = "";
    associationRoot.hidden = false;
    await loadAssociation();

    requestAnimationFrame(() => {
      if(name === "yhdistys"){
        window.scrollTo({top:0,behavior:"smooth"});
        return;
      }
      const target = findAssociationTarget(name);
      if(target){
        const top = target.getBoundingClientRect().top + window.scrollY - 76;
        window.scrollTo({top:Math.max(0,top),behavior:"smooth"});
      }
    });
  }

  function openVisualization(name){
    const view = VIEWS[name];
    if(!view?.url) return;

    associationRoot.hidden = true;
    visualRoot.hidden = false;
    visualRoot.innerHTML = "";
    loader.hidden = false;

    const frame = document.createElement("iframe");
    frame.className = "view-frame";
    frame.title = view.title;
    frame.allow = "fullscreen";
    frame.loading = "eager";
    frame.src = view.url;
    activeFrame = frame;

    frame.addEventListener("load",() => {
      loader.hidden = true;
      // Lähetetään valittu teema Atlas-sivulle. Vastaanottava näkymä voi soveltaa sen.
      sendThemeToVisualization();
    },{once:true});

    if(name === "verkko"){
      // Verkon oma moduulipalkki + sen tumma/vaalea-painike rajataan pois.
      // Yhteinen yläpalkki jää ainoaksi navigaatioksi.
      const crop = document.createElement("div");
      crop.className = "visual-crop visual-crop--verkko";
      crop.appendChild(frame);
      visualRoot.appendChild(crop);
    }else{
      visualRoot.appendChild(frame);
    }
  }

  async function showView(name){
    if(!VIEWS[name]) name = "yhdistys";
    if(active === name) return;
    active = name;
    setTabs(name);

    if(VIEWS[name].type === "association") await showAssociation(name);
    else openVisualization(name);

    document.title = `${VIEWS[name].title} · Hyvinvointivaltion Vaalijat ry`;
  }

  function selectedView(){
    const key = location.hash.replace(/^#\/?/,"");
    return VIEWS[key] ? key : "yhdistys";
  }

  function stepModule(delta){
    const current = MODULE_ORDER.includes(active) ? active : MODULE_ORDER[0];
    const i = MODULE_ORDER.indexOf(current);
    const next = MODULE_ORDER[(i+delta+MODULE_ORDER.length)%MODULE_ORDER.length];
    location.hash = next;
  }

  function closeMenu(){
    moduleMenu.hidden = true;
    moduleCurrent.setAttribute("aria-expanded","false");
  }

  associationTab.addEventListener("click",() => { closeMenu(); location.hash="yhdistys"; });
  newsTab.addEventListener("click",() => { closeMenu(); location.hash="ajankohtaista"; });
  joinTab.addEventListener("click",() => { closeMenu(); location.hash="liity"; });

  document.getElementById("modulePrev").addEventListener("click",() => stepModule(-1));
  document.getElementById("moduleNext").addEventListener("click",() => stepModule(1));

  moduleCurrent.addEventListener("click",() => {
    const open = moduleMenu.hidden;
    moduleMenu.hidden = !open;
    moduleCurrent.setAttribute("aria-expanded",String(open));
  });

  moduleMenu.addEventListener("click",e => {
    const button = e.target.closest("[data-module]");
    if(!button) return;
    closeMenu();
    location.hash = button.dataset.module;
  });

  document.addEventListener("click",e => {
    if(!e.target.closest(".module-browser")) closeMenu();
  });

  themeBtn.addEventListener("click",() => {
    applyTheme(currentTheme() === "dark" ? "light" : "dark");
  });

  document.getElementById("fsBtn").addEventListener("click",async() => {
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    }catch{}
  });

  window.addEventListener("hashchange",() => showView(selectedView()));
  showView(selectedView());
})();
</script>
</body>
</html>
